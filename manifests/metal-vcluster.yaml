apiVersion: storage.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: metal-vcluster
  namespace: p-default
spec:
  displayName: "Metal vCluster"
  clusterRef:
    cluster: metal-cp
    namespace: vcluster-metal-vcluster
  template:
    helmRelease:
      chart:
        version: "0.33.1"
      values: |-
        privateNodes:
          enabled: true
          vpn:
            enabled: true
