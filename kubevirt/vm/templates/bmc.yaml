{{- if $.Values.rack.enabled }}
{{- range .Values.vms }}
{{- if .bmcBr0Ip }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0-{{ .name }}-bmc
  namespace: {{ $.Values.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "br0",
      "isDefaultGateway": false,
      "ipam": {
        "type": "static",
        "addresses": [{"address": "{{ .bmcBr0Ip }}/24"}]
      }
    }
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-bmc
  namespace: {{ $.Values.namespace }}
stringData:
  username: {{ .bmh.bmc.username | quote }}
  password: {{ .bmh.bmc.password | quote }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}-virtbmc
  namespace: {{ $.Values.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}-virtbmc
  namespace: {{ $.Values.namespace }}
rules:
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines"]
  verbs: ["get", "list", "watch", "update"]
- apiGroups: ["subresources.kubevirt.io"]
  resources: ["virtualmachines/start", "virtualmachines/stop", "virtualmachines/restart"]
  verbs: ["update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-virtbmc
  namespace: {{ $.Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .name }}-virtbmc
subjects:
- kind: ServiceAccount
  name: {{ .name }}-virtbmc
  namespace: {{ $.Values.namespace }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .name }}-virtbmc
  namespace: {{ $.Values.namespace }}
  labels:
    kubevirt.io/virtualmachinebmc-name: {{ .name }}
    kubevirt.io/vm-name: {{ .name }}
spec:
  serviceName: {{ .name }}-virtbmc
  replicas: 1
  selector:
    matchLabels:
      kubevirt.io/virtualmachinebmc-name: {{ .name }}
  template:
    metadata:
      labels:
        kubevirt.io/virtualmachinebmc-name: {{ .name }}
        kubevirt.io/vm-name: {{ .name }}
      {{- if .bmcBr0Ip }}
      annotations:
        k8s.v1.cni.cncf.io/networks: br0-{{ .name }}-bmc
      {{- end }}
    spec:
      serviceAccountName: {{ .name }}-virtbmc
      containers:
      - name: virtbmc
        image: ghcr.io/loft-sh/kubevirtbmc/virtbmc:v0.7.0-vcluster
        args:
        - --address
        - 0.0.0.0
        - --ipmi-port
        - "10623"
        - --redfish-port
        - "10080"
        - {{ $.Values.namespace }}
        - {{ .name }}
        env:
        - name: BMC_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .name }}-bmc
              key: username
        - name: BMC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .name }}-bmc
              key: password
        ports:
        - containerPort: 10623
          name: ipmi
          protocol: UDP
        - containerPort: 10080
          name: redfish

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-virtbmc
  namespace: {{ $.Values.namespace }}
  labels:
    kubevirt.io/virtualmachinebmc-name: {{ .name }}
    kubevirt.io/vm-name: {{ .name }}
spec:
  type: NodePort
  selector:
    kubevirt.io/virtualmachinebmc-name: {{ .name }}
  ports:
  - name: ipmi
    port: 623
    protocol: UDP
    targetPort: ipmi
  - name: redfish
    port: 10080
    protocol: TCP
    targetPort: redfish
    nodePort: {{ .nodePort }}
{{- end }}
{{- end }}
